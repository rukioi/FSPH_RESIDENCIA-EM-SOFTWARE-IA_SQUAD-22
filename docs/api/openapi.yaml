  /api/solicitacoes-viagem/agenda:
    get:
      operationId: solicitacoes_get__api_solicitacoes_viagem_agenda
      tags:
        - solicitacoes
      description: Período inicio/fim ISO com offset, até 31 dias. Só AGENDADA intersectando [inicio,fim). page=1, limit=20 (máximo 100). Dados mínimos e recursos; retorno legado ausente é null, sem fim presumido.
      security:
        - bearerAuth: []
      x-perfis: *a1
      x-runtime-validation: true
      parameters:
        - name: inicio
          in: query
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            description: ISO com offset explícito até ±15:59, sem ano zero; a normalização institucional deve permanecer entre os anos 0001 e 9999.
            allOf:
              - not:
                  pattern: ^0000-
              - pattern: (?:Z|[+-](?:0\d|1[0-5]):[0-5]\d)$
        - name: fim
          in: query
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            description: ISO com offset explícito até ±15:59, sem ano zero; a normalização institucional deve permanecer entre os anos 0001 e 9999.
            allOf:
              - not:
                  pattern: ^0000-
              - pattern: (?:Z|[+-](?:0\d|1[0-5]):[0-5]\d)$
        - name: page
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            pattern: ^[1-9]\d*$
        - name: limit
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            pattern: ^[1-9]\d*$
      responses:
        "200":
          description: Sucesso no formato atual
          headers:
            X-Request-Id:
              description: UUID gerado pelo servidor; IDs recebidos não são confiados.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaAgendaViagem"
        "400":
