components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ListaNotificacoes:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^\d+$
              titulo:
                type: string
              descricao:
                type: string
              categoria:
                type: string
                enum:
                  - informacao
                  - atencao
                  - urgente
                  - sucesso
              criadoEm:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              lidaEm:
                anyOf:
                  - type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  - type: "null"
            required:
              - id
              - titulo
              - descricao
              - categoria
              - criadoEm
              - lidaEm
        meta:
          type: object
          properties:
            page:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            limit:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            naoLidas:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - page
            - limit
            - total
            - naoLidas
      required:
        - data
        - meta
    NotificacoesAtualizadas:
      type: object
      properties:
        data:
          type: object
          properties:
            atualizadas:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - atualizadas
      required:
        - data
    Erro:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
          required:
            - code
            - message
      required:
        - error
    ErroString:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ErroSvo:
      type: object
      properties:
        erro:
          type: string
      required:
        - erro
    ErroUsuario:
      anyOf:
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                fields:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              required:
                - code
                - message
          required:
            - error
        - type: object
          properties:
            error:
              type: string
          required:
            - error
    ErroOperacionalSvo:
      anyOf:
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                fields:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              required:
                - code
