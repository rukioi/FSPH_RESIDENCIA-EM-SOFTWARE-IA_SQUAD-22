          required:
            - error
        - type: object
          properties:
            erro:
              type: string
          required:
            - erro
    Exclusao:
      type: object
      properties:
        data:
          type: object
          properties:
            success:
              type: boolean
              const: true
          required:
            - success
      required:
        - data
    FotoVeiculoEntrada:
      type: object
      properties:
        tipo:
          type: string
          enum:
            - image/jpeg
            - image/png
        dadosBase64:
          type: string
          minLength: 1
          maxLength: 1398104
      required:
        - tipo
        - dadosBase64
    FotoVeiculoResposta:
      type: object
      properties:
        data:
          type: object
          properties:
            foto:
              anyOf:
                - type: object
                  properties:
                    tipo:
                      type: string
                      enum:
                        - image/jpeg
                        - image/png
                    dadosBase64:
                      type: string
                      minLength: 1
                      maxLength: 1398104
                  required:
                    - tipo
                    - dadosBase64
                - type: "null"
          required:
            - foto
      required:
        - data
    Veiculo:
      type: object
      properties:
        id:
          type: string
          pattern: ^-?\d+$
          description: BIGINT serializado pelo postgres como string; não converter para Number.
        placa:
          type: string
        modelo:
          type: string
        marca:
          type: string
        ano:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        tipo:
          type: string
          enum:
            - PASSEIO
            - VAN
            - AMBULANCIA
            - RABECÃO_SVO
        capacidade_obitos:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        quilometragem_atual:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        status:
          anyOf:
            - type: string
              enum:
                - DISPONIVEL
                - EM_VIAGEM
                - EM_MANUTENCAO
                - INDISPONIVEL
            - type: "null"
        is_svo:
          type:
            - boolean
            - "null"
        criado_em:
          anyOf:
            - type: string
              description: Timestamp sem fuso no banco, serializado pelo driver como ISO; não redefine seu significado histórico.
            - type: "null"
        capacidade_passageiros:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        vinculo:
          type: string
          enum:
            - PROPRIO
            - LOCADO
        fornecedor_locacao:
          type:
            - string
            - "null"
      required:
        - id
        - placa
        - modelo
        - marca
        - ano
        - tipo
        - capacidade_obitos
        - quilometragem_atual
        - status
        - is_svo
        - criado_em
        - capacidade_passageiros
        - vinculo
        - fornecedor_locacao
    CriarVeiculo:
      type: object
      properties:
        placa:
          type: string
          pattern: \S
        modelo:
          type: string
          pattern: \S
        marca:
          type: string
          pattern: \S
        ano:
          type: integer
          minimum: 1900
          maximum: 2100
        tipo:
          anyOf:
            - type: string
              enum:
                - PASSEIO
                - VAN
                - AMBULANCIA
                - RABECÃO_SVO
            - type: "null"
        status:
          type: string
          enum:
            - DISPONIVEL
            - EM_VIAGEM
            - EM_MANUTENCAO
            - INDISPONIVEL
        vinculo:
          anyOf:
            - type: string
              enum:
                - PROPRIO
                - LOCADO
            - type: "null"
        fornecedor_locacao:
          anyOf:
            - type: string
              pattern: \S
            - type: "null"
        capacidade_obitos:
          anyOf:
            - type: number
              minimum: 0
              multipleOf: 1
            - type: "null"
        capacidade_passageiros:
          anyOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 1
            - type: "null"
        quilometragem_atual:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
        is_svo:
          type:
            - boolean
            - "null"
      required:
        - placa
        - modelo
        - marca
        - ano
      description: Campos extras ignorados. Valores null dos opcionais usam defaults, exceto status. LOCADO exige fornecedor não vazio. Quilometragem decimal passa pela validação atual, mas pode ser recusada pelo INTEGER no banco.
      allOf:
        - if:
            properties:
              vinculo:
                const: LOCADO
            required:
              - vinculo
          then:
            properties:
              fornecedor_locacao:
                type: string
                pattern: \S
            required:
              - fornecedor_locacao
    EditarVeiculo:
      type: object
      properties:
        placa:
          type: string
          pattern: \S
        marca:
          type: string
          pattern: \S
        modelo:
          type: string
          pattern: \S
        status:
          type: string
          enum:
            - DISPONIVEL
            - EM_VIAGEM
            - EM_MANUTENCAO
            - INDISPONIVEL
        capacidade_passageiros:
          type: number
          exclusiveMinimum: 0
          multipleOf: 1
        vinculo:
          type: string
          enum:
            - PROPRIO
            - LOCADO
        fornecedor_locacao:
          anyOf:
            - type: string
              pattern: \S
            - type: "null"
      description: PUT e PATCH são parciais; demais campos são ignorados. LOCADO explícito exige fornecedor no mesmo corpo. PROPRIO limpa fornecedor; null não limpa fornecedor de LOCADO.
      allOf:
        - if:
            properties:
              vinculo:
                const: LOCADO
            required:
              - vinculo
          then:
            properties:
              fornecedor_locacao:
                type: string
                pattern: \S
            required:
              - fornecedor_locacao
