name: Evidências do Dashboard Gestor

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tests/e2e/dashboard-gestor.spec.ts'
      - 'playwright.dashboard.config.ts'
      - '.github/workflows/dashboard-evidencias.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.dashboard.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-gestor-390-768-1280
          path: test-results/dashboard/
          retention-days: 14
