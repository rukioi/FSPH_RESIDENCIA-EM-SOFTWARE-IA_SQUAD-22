name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/reorganizacao-global-2026]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contrato, banco e fluxos isolados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provisionar e confirmar banco exclusivo do harness
        run: npm run db:test:start
      - run: npm run db:test:prepare
      - run: npm run db:docs:check
      - run: npm run api:check
      - run: npm run client:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Conferir ausência de deriva e compilados rastreados
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files backend/dist frontend/dist)"
      - name: Publicar capturas e relatório para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
