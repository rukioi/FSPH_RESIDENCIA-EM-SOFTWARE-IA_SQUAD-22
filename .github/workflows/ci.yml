name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/reorganizacao-global-2026]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contrato, banco e fluxos isolados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar isolamento dos testes Sprint 9
        run: node --test backend/tests/database/sprint9-preflight-static.test.mjs backend/tests/database/s9-preflight-harness.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Provisionar e confirmar banco exclusivo do harness
        run: npm run db:test:start
      - run: npm run db:test:prepare
      - name: Ensaiar backup e restauração no PostgreSQL isolado
        run: npm run db:test:restore
      - name: Ensaiar upgrade e recuperação de dados legados
        run: npm run db:test:upgrade
      - name: Ensaiar cópia e recuperação de arquivos legados
        run: npm run db:test:file-pilot
      - name: Auditar permissões SQL e planos de consulta no PostgreSQL isolado
        run: npm run db:test:audit
      - run: npm run db:docs:check
      - run: npm run test:db
      - run: npm run api:check
      - run: npm run client:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Executar E2E dos fluxos existentes
        run: npm run test:e2e -- '^(?!.*manutencoes(?:-indicadores)?\.spec\.ts$)'
      - name: Executar E2E de Manutenções no perfil S10 dedicado
        env:
          FSPH_TEST_PROFILE: s10-candidata-e2e
          MANUTENCAO_ALERTAS_ATIVOS: 'false'
        run: |
          docker image inspect postgres:17 >/dev/null 2>&1 || docker pull postgres:17
          npm run db:test:s10:provision
          npm run db:test:start
          npm run db:test:prepare
          npm run test:e2e -- --output=test-results/sprint10 'manutencoes(?:-indicadores)?\.spec\.ts$'
      - name: Conferir ausência de deriva e compilados rastreados
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files backend/dist frontend/dist)"
      - name: Publicar capturas e relatório para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
